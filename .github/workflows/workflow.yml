
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.1"
  FFMPEG_BASE: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - name: Windows
            os: windows-latest
            bundles: nsis
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$app" != "$tag" ]; then
            echo "::error::Tag v$tag but tauri.conf.json says $app. Bump the version first."
            exit 1
          fi

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils file

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4 

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL "$FFMPEG_BASE/ffmpeg-master-latest-linux64-gpl.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest "$env:FFMPEG_BASE/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP "ffmpeg-master-latest-win64-gpl\bin")

      - name: Engine tests (with real ffmpeg)
        run: |
          ffmpeg -hide_banner -version | sed -n 1p
          cargo test -p zvc-core -- --nocapture 2>&1 | tee test.log
          # The real-ffmpeg tests skip themselves when ffmpeg is missing. Here that would be a
          # silent pass, so treat it as a failure.
          if grep -q "no ffmpeg on PATH, skipping" test.log; then
            echo "::error::The real-ffmpeg tests were skipped: ffmpeg was not found."
            exit 1
          fi

      
      - name: One-click ffmpeg download
        run: cargo test -p zvc-core --test ffmpeg_download -- --ignored --nocapture

      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Check glibc requirement
        if: runner.os == 'Linux'
        run: |
          need="$(objdump -T target/release/zvideoconverter | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)"
          echo "The binary needs $need"
          if [ "$(printf '%s\n' "$need" GLIBC_2.35 | sort -V | tail -1)" != "GLIBC_2.35" ]; then
            echo "::error::$need is newer than Ubuntu 22.04's glibc 2.35."
            exit 1
          fi

      - name: Collect files
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm \
               target/release/bundle/appimage/*.AppImage out/
          else
            cp target/release/bundle/nsis/*-setup.exe out/
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ZVideoConverter-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        run: |
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ZVideoConverter ${{ github.ref_name }}
          files: out/*
