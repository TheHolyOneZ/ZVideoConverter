[workspace]
members = ["crates/zvc-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["TheHolyOneZ"]
repository = "https://github.com/TheHolyOneZ/ZVideoConverter"
homepage = "https://zsync.eu/zvideoconverter/"
readme = "README.md"
documentation = "https://github.com/TheHolyOneZ/ZVideoConverter#readme"
keywords = ["video", "converter", "ffmpeg", "gpu", "batch"]
categories = ["multimedia::video", "multimedia::encoding"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
sha2 = "0.10"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
